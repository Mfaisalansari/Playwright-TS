name: Playwright Tests
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
    inputs:
      env: { description: 'Test environment', default: 'qa' }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_ENV: ${{ github.event.inputs.env || 'qa' }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run coverage:functions -- --strict
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            reports/
            test-results/
            logs/
          retention-days: 14
