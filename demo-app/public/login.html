<!doctype html>
<html><head><meta charset="utf-8"><title>Login | QA Demo App</title><link rel="stylesheet" href="/style.css"><script src="/nav.js"></script></head>
<body><main>
  <section style="max-width:420px">
    <h1>Sign in</h1>
    <form id="loginForm">
      <div class="row"><label for="username">Username</label><input id="username" name="username" placeholder="Enter username" autocomplete="off"></div>
      <div class="row"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Enter password"></div>
      <div class="row"><label><input type="checkbox" id="rememberMe"> Remember me</label></div>
      <button type="submit" id="loginBtn" data-testid="login-submit">Login</button>
    </form>
    <p id="loginError" class="error" role="alert"></p>
    <p class="hint">Valid credentials: admin / Admin@123</p>
  </section>
</main>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('loginError');
    err.textContent = '';
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    if (!username || !password) { err.textContent = 'Username and password are required'; return; }
    const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
    const body = await res.json();
    if (!res.ok) { err.textContent = body.error; return; }
    localStorage.setItem('token', body.token);
    localStorage.setItem('user', body.user);
    if (document.getElementById('rememberMe').checked) localStorage.setItem('remember', 'yes');
    location.href = '/dashboard.html';
  });
</script>
</body></html>
