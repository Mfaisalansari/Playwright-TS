<!doctype html>
<html><head><meta charset="utf-8"><title>Dashboard | QA Demo App</title><link rel="stylesheet" href="/style.css"><script src="/nav.js"></script>
<script>if (!localStorage.getItem('token')) location.replace('/login.html?redirected=1');</script></head>
<body><main>
  <h1 id="welcome">Welcome</h1>
  <section>
    <h2>Quick links</h2>
    <a href="/forms.html" id="goRegistration">New registration</a> |
    <a href="/table.html" id="goEmployees">Employees</a> |
    <a href="#" id="logoutLink">Logout</a>
  </section>
  <section>
    <h2>Summary</h2>
    <p>Open policies: <span id="openPolicies">42</span></p>
    <p>Pending quotes: <span id="pendingQuotes">7</span></p>
  </section>
</main>
<script>
  document.getElementById('welcome').textContent = 'Welcome, ' + (localStorage.getItem('user') || 'guest');
  document.getElementById('logoutLink').addEventListener('click', (e) => {
    e.preventDefault();
    localStorage.clear();
    location.href = '/login.html?loggedOut=1';
  });
</script>
</body></html>
